groups:
  - name: sms
    rules:
      - alert: SMSBackendDown
        expr: up{job="sms-backend"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "SMS backend metrics unavailable for 2 minutes"}
      - alert: SMSHighServerErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "SMS server errors exceed 5%"}
      - alert: SMSReadLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{method="GET"}[5m]))) > 2
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "SMS GET p95 exceeds 2 seconds"}
