global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/alerts-infra.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: sms-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:9092']

  - job_name: sms-cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: sms-node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: sms-frontend-probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://frontend:8080/healthz']
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: sms-backend-readiness-probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://backend:9092/actuator/health/readiness']
    relabel_configs: *blackbox_relabel
