global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: sms-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:9092]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
