spring.application.name=backend
spring.config.import=optional:file:./backend/.env.local[.properties],optional:file:./.env.local[.properties]
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_SECURE:false}
spring.servlet.multipart.max-file-size=${SMS_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${SMS_MAX_REQUEST_SIZE:20MB}
sms.files.directory=${SMS_FILES_DIR:./private-files}
sms.identity.key=${SMS_IDENTITY_KEY:}
sms.school-email-domain=${SMS_SCHOOL_EMAIL_DOMAIN:student.campus.edu.vn}
sms.jwt.secret=${SMS_JWT_SECRET}
sms.jwt.ttl-seconds=${SMS_JWT_TTL_SECONDS:1800}
sms.jwt.cookie-secure=${SESSION_SECURE:false}
sms.bootstrap.enabled=${SMS_BOOTSTRAP_ENABLED:false}
sms.bootstrap.username=${SMS_BOOTSTRAP_USERNAME:}
sms.bootstrap.email=${SMS_BOOTSTRAP_EMAIL:}
sms.bootstrap.password=${SMS_BOOTSTRAP_PASSWORD:}
server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.springframework.security=INFO
spring.mvc.log-request-details=false

sms.mail.enabled=${SMS_MAIL_ENABLED:false}
sms.outbox.enabled=${SMS_OUTBOX_ENABLED:false}
sms.outbox.delay-ms=${SMS_OUTBOX_DELAY_MS:30000}
sms.mail.from=${SMS_SMTP_USERNAME:}
sms.mail.smtp.host=${SMS_SMTP_HOST:smtp.gmail.com}
sms.mail.smtp.port=${SMS_SMTP_PORT:587}
sms.mail.smtp.username=${SMS_SMTP_USERNAME:}
sms.mail.smtp.password=${SMS_SMTP_PASSWORD:}
sms.mail.smtp.timeout-ms=${SMS_SMTP_TIMEOUT_MS:5000}
sms.public-url=${SMS_PUBLIC_URL:http://127.0.0.1:5173}
